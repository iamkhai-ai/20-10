<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>20/10 - Ngôi nhà yêu thương</title>
<meta name="theme-color" content="#fbc2eb" />
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1a1024;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#fff}
  canvas{display:block}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1a1024;z-index:10;font-size:18px}
  #hint{position:fixed;left:0;right:0;bottom:16px;text-align:center;font-size:14px;opacity:.85;z-index:5;pointer-events:none}
  #modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:20;padding:20px}
  #modal .box{background:rgba(255,255,255,.15);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:28px 22px;max-width:420px;text-align:center}
  #modal h2{margin:0 0 12px}
  #modal p{line-height:1.7;margin:0 0 16px}
  #modal button{padding:10px 18px;border:none;border-radius:999px;background:#fff;color:#c44569;font-weight:700;cursor:pointer}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="loading">Đang tải ngôi nhà...</div>
<div id="hint"></div>
<div id="modal"><div class="box"><h2>💌 Thiệp 20/10</h2><p id="modalText"></p><button id="closeModal">Đóng</button></div></div>
<script type="module" src="./main.js"></script>
</body>
</html>
